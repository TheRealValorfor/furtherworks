authors="Worlds Further"
description='''The Further — Worlds Further endgame catalyst.

Craft four pillar hearts from Relics, Aeronautics, Ars Nouveau, and feast food, then mechanical-craft The Further. Spend it to unlock Create's Creative Motor, Creative Fluid Tank, Creative Blaze Cake, and Simulated's Creative Physics Staff.

Worldshaper and Creative Crate stay creative-only.
'''

